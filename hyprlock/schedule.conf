# HyprSchedule — lockscreen schedule label (Phase 5)
#
# hyprlock has no include/source directive (unlike hyprland.conf), so this
# file is a documented snippet: copy the label block below into
# ~/.config/hypr/hyprlock.conf. Do not use it as-is with `hyprlock -c`.
#
# The label runs `schedctl lock` every 30 seconds (update is in
# milliseconds). Output is plain text only — no markup, no JSON, no ANSI
# escapes — so event titles are always rendered as literal text.
#
# Privacy semantics (backend-enforced, see ARCHITECTURE.md):
#   public   -> full title/location
#   private  -> "Có lịch cá nhân" (unless [lockscreen] show_private = true)
#   hidden   -> never displayed, never counted

label {
    monitor =
    text = cmd[update:30000] schedctl lock

    font_size = 16
    position = -50, -100
    halign = right
    valign = top
    text_align = left
}